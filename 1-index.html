function tag(w,iv,C){var H=encBlock(w,new Uint8Array(16)),g=ghash(H,C),j0=new Uint8Array(16);j0.set(iv);j0[15]=1;var e=encBlock(w,j0);for(var j=0;j<16;j++)g[j]^=e[j];return g;}
function dec(key,iv,ct){var w=expand(key),C=ct.subarray(0,ct.length-16),T=ct.subarray(ct.length-16),t=tag(w,iv,C),d=0;
 for(var j=0;j<16;j++)d|=t[j]^T[j];if(d)throw new Error('auth');return ctr(w,iv,C);}
function enc(key,iv,pt){var w=expand(key),C=ctr(w,iv,pt),t=tag(w,iv,C);return concat(C,t);}
return{pbkdf2:pbkdf2,dec:dec,enc:enc};
})();

</script>
<script>
(function(){
var msg=document.getElementById('msg'),pw=document.getElementById('pw'),go=document.getElementById('go');
function say(t){msg.textContent=t;}
window.onerror=function(m){say('خطأ: '+m);};
var P;try{P=JSON.parse(document.getElementById('pl').textContent);}catch(e){say('الملف تالف');return;}

function utf8(s){if(typeof TextEncoder!=='undefined')return new TextEncoder().encode(s);var u=unescape(encodeURIComponent(s)),a=new Uint8Array(u.length);for(var i=0;i<u.length;i++)a[i]=u.charCodeAt(i);return a;}
function str(u){if(typeof TextDecoder!=='undefined')return new TextDecoder().decode(u);var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return decodeURIComponent(escape(s));}
function b2u(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
var hasSubtle=!!(window.crypto&&crypto.subtle&&crypto.subtle.importKey);
var SK='ahwa.'+P.f;
// engine: {dec(iv,ct)->Promise<Uint8Array>, enc(iv,pt)->Promise<Uint8Array>}
function subtleEngine(p){
  return crypto.subtle.importKey('raw',utf8(p),'PBKDF2',false,['deriveKey']).then(function(km){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }).then(function(key){return{
    dec:function(iv,ct){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct).then(function(x){return new Uint8Array(x);});},
    enc:function(iv,pt){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,pt).then(function(x){return new Uint8Array(x);});}};});
}
function jsEngine(p){
  return PC.pbkdf2(utf8(p),b2u(P.s),P.i,function(f){say('جاري الفتح… '+Math.round(f*100)+'%');}).then(function(key){return{
    dec:function(iv,ct){try{return Promise.resolve(PC.dec(key,iv,ct));}catch(e){return Promise.reject(e);}},
    enc:function(iv,pt){try{return Promise.resolve(PC.enc(key,iv,pt));}catch(e){return Promise.reject(e);}}};});
}
function randIv(){var iv=new Uint8Array(12);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(iv);else for(var i=0;i<12;i++)iv[i]=Math.floor(Math.random()*256);return iv;}
function getEngine(p){
  if(!hasSubtle)return jsEngine(p);
  return subtleEngine(p).catch(function(){return jsEngine(p);});
}
function idbOpen(){return new Promise(function(res,rej){var rq=indexedDB.open('ahwa-backup',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('kv');};rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){rej(rq.error||new Error('idb'));};});}
function idbSet(k,v){return idbOpen().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=function(){db.close();res();};tx.onerror=function(){db.close();rej(tx.error||new Error('idb'));};});});}
function idbGet(k){return idbOpen().then(function(db){return new Promise(function(res,rej){var rq=db.transaction('kv','readonly').objectStore('kv').get(k);rq.onsuccess=function(){db.close();res(rq.result||null);};rq.onerror=function(){db.close();rej(rq.error||new Error('idb'));};});});}
function start(eng,app){
  var host={root:document.getElementById('root'),
    load:function(){var raw=null;try{raw=localStorage.getItem(SK);}catch(e){}
      function decRaw(r){var o=JSON.parse(r);return eng.dec(b2u(o.v),b2u(o.c)).then(function(u){return JSON.parse(str(u));});}
      if(raw){idbSet(SK,{raw:raw,ts:Date.now()}).catch(function(){});return decRaw(raw);}
      return idbGet(SK).then(function(rec){if(!rec||!rec.raw)return null;try{localStorage.setItem(SK,rec.raw);}catch(e){}return decRaw(rec.raw);},function(){return null;});},
    save:function(st){var iv=randIv();return eng.enc(iv,utf8(JSON.stringify(st))).then(function(ct){var raw=JSON.stringify({v:u2b(iv),c:u2b(ct)});localStorage.setItem(SK,raw);return idbSet(SK,{raw:raw,ts:Date.now()}).catch(function(){});});},
    exportRaw:function(){var raw=null;try{raw=localStorage.getItem(SK);}catch(e){}return Promise.resolve(raw);},
    importRaw:function(raw){var o;try{o=JSON.parse(raw);}catch(e){return Promise.resolve(false);}
      if(!o||typeof o.v!=='string'||typeof o.c!=='string')return Promise.resolve(false);
      return eng.dec(b2u(o.v),b2u(o.c)).then(function(){try{localStorage.setItem(SK,raw);}catch(e){}return idbSet(SK,{raw:raw,ts:Date.now()}).catch(function(){}).then(function(){return true;});},function(){return false;});}};
  var s=document.createElement('style');s.textContent=app.css;document.head.appendChild(s);
  document.getElementById('gate').style.display='none';document.getElementById('root').style.display='block';document.body.style.display='block';
  try{(new Function('host',app.js))(host);}catch(e){document.getElementById('root').textContent='خطأ في التشغيل: '+(e&&e.message);}
}
var busy=false;
function unlock(){
  if(busy)return;busy=true;go.disabled=true;say('جاري الفتح…');
  var p=pw.value,eng;
  setTimeout(function(){
    getEngine(p).then(function(e){eng=e;return e.dec(b2u(P.v),b2u(P.c));})
    .then(function(u){var app=JSON.parse(str(u));pw.value='';start(eng,app);})
    .catch(function(e){say(e&&(e.message==='auth'||e.name==='OperationError')?'الباسورد غلط':'تعذر الفتح: '+((e&&(e.name||e.message))||e));busy=false;go.disabled=false;});
  },30);
}
go.addEventListener('click',unlock);
pw.addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13)unlock();});
window.__m=1;
})();
</script>
<script>if(!window.__m){document.getElementById("msg").textContent="⚠ العارض ده قديم ومش بيدعم البرنامج. افتح الملف من متصفح حديث زي Chrome.";}</script></body></html>
